<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#10b981" stroke-opacity="0.25" stroke-width="4" />
  
  <!-- Modern Growth Trendline & Grid -->
  <g opacity="0.15">
    <line x1="96" y1="360" x2="416" y2="360" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 6" />
    <line x1="96" y1="280" x2="416" y2="280" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 6" />
    <line x1="96" y1="200" x2="416" y2="200" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 6" />
  </g>
  
  <!-- Bar Charts -->
  <rect x="110" y="270" width="38" height="90" rx="8" fill="#334155" />
  <rect x="170" y="220" width="38" height="140" rx="8" fill="#475569" />
  <rect x="230" y="160" width="38" height="200" rx="8" fill="url(#accentGrad)" />
  
  <!-- Dynamic Growth Line -->
  <path d="M 120 280 L 190 230 L 250 170 L 320 200 L 400 120" fill="none" stroke="url(#emeraldGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Pulsing Peak Node -->
  <circle cx="400" cy="120" r="14" fill="#34d399" />
  <circle cx="400" cy="120" r="22" fill="none" stroke="#34d399" stroke-width="4" stroke-opacity="0.5" />
  
  <!-- Rupee Symbol Crest -->
  <g transform="translate(305, 230)">
    <rect width="115" height="115" rx="24" fill="#0f172a" stroke="#10b981" stroke-width="3" />
    <path d="M 32 32 L 82 32 M 32 46 L 82 46 M 32 32 L 56 32 C 72 32 74 58 56 58 L 32 58 L 78 88" fill="none" stroke="#34d399" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
